name: Java CI with Gradle and Docker

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.34
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: yes
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: pass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Start SUT
        run: |
          
          java -jar aqa-shop.jar \
            --spring.datasource.url=jdbc:mysql://127.0.0.1:3306/app \
            --spring.datasource.username=app \
            --spring.datasource.password=pass > sut.log 2>&1 &
          
          echo "Waiting for SUT to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "SUT is up!"
              sleep 5 # Даем дополнительно 5 секунд на прогрев (создание таблиц)
              break
            fi
            echo "Attempt $i: SUT is not ready yet..."
            sleep 2
          done

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test -Ddb.url=jdbc:mysql://127.0.0.1:3306/app

      - name: Show SUT Logs on Failure
        if: failure()
        run: cat sut.log

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate build/allure-results -o build/allure-report

      - name: Archive Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: build/allure-report