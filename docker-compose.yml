services:
  mysql:
    image: mysql:8.0.34
    container_name: aqa-shop-mysql
    restart: always
    ports:
      - '3306:3306'

    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=app
      - MYSQL_USER=app
      - MYSQL_PASSWORD=pass
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-ppass" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s